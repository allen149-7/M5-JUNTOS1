/* Diseño tomado de M5 Music (Android): mismo degradado, portada con máscara, cristal, botones redondos y barras finas */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bg1:#a63d24;--bg2:#4a140c;--bg3:#1c0604;--fg:#fff;--fg2:rgba(255,255,255,.75);--glass:rgba(255,255,255,.22);--track:rgba(255,255,255,.3);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg3);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);overflow:hidden}
button{font:inherit}
[hidden]{display:none!important}
.screen{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:480px;transform:translateX(-50%);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%);transition:background .6s}
.bgblur{position:absolute;inset:-10% -20% 20% -20%;background-size:cover;background-position:center top;filter:blur(48px) saturate(1.25);opacity:.55;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.screen::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--sat) + 48px);background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,0));z-index:2;pointer-events:none}

/* ---------- Botones y controles (iguales a M5 Music) ---------- */
.rb{width:40px;height:40px;border-radius:50%;border:0;background:var(--glass);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.rb svg{width:20px;height:20px}
.rb.on{color:#ff6b81}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--fg) var(--p),var(--track) var(--p))}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
input[type=range]:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 14px;border-radius:18px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1}
.glass{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}

/* ---------- Pantalla de inicio (sala) ---------- */
#home{--bg1:#000;--bg2:#000;--bg3:#000;background:#000;z-index:10;padding:calc(var(--sat) + 28px) 22px calc(var(--sab) + 24px);justify-content:center}
#home .card.glass{background:#1a1a1c;border:1px solid rgba(255,255,255,.08);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#home .inp{background:#2a2a2d}
#home .btn:not(.pri){background:#2a2a2d}
#home .bgblur{display:none}
#home .logo{width:84px;height:84px;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.6));margin:0 0 22px}
#home .logo svg{width:44px;height:44px}
#home h1{font-size:34px;margin:0 0 6px;font-weight:800;letter-spacing:-.5px;position:relative;z-index:1}
#home p.sub{margin:0 0 30px;color:var(--fg2);font-size:15px;line-height:1.4;position:relative;z-index:1}
.card{border-radius:26px;padding:18px;position:relative;z-index:1;margin-bottom:14px}
.card label{display:block;font-size:12px;font-weight:700;color:var(--fg2);letter-spacing:.4px;text-transform:uppercase;margin:0 0 8px 4px}
.inp{width:100%;border:0;border-radius:16px;background:rgba(0,0,0,.28);color:#fff;font-size:17px;padding:14px 16px;outline:none;font-family:inherit}
.inp::placeholder{color:rgba(255,255,255,.45)}
.inp:focus{box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.code{letter-spacing:6px;text-transform:uppercase;text-align:center;font-weight:700;font-size:22px}
.btn{width:100%;border:0;border-radius:18px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:var(--glass)}
.btn.pri{background:#fff;color:#4a140c}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;margin-top:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--fg2);font-size:13px;margin:4px 6px 14px;position:relative;z-index:1}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.2)}

/* ---------- Sala: reproductor (misma estructura que M5 Music) ---------- */
#room{z-index:5}
.top{position:absolute;left:14px;right:14px;top:calc(var(--sat) + 10px);z-index:4;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.top .rb{background:rgba(0,0,0,.35)}
.chip{display:flex;align-items:center;gap:8px;border-radius:22px;padding:8px 14px 8px 12px;background:rgba(0,0,0,.35);font-size:13px;font-weight:700;cursor:pointer;border:0;color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chip i{width:8px;height:8px;border-radius:50%;background:#7ee08a;box-shadow:0 0 8px #7ee08a}
.chip b{letter-spacing:2px}
.spacer{flex:1}
.cover{flex:1;min-height:0;position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.cover img,.cover .ph{width:100%;height:100%;object-fit:cover;object-position:top;-webkit-mask-image:linear-gradient(#000 50%,rgba(0,0,0,.55) 78%,transparent 100%);mask-image:linear-gradient(#000 50%,rgba(0,0,0,.55) 78%,transparent 100%)}
.ph{background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.25),transparent 55%),linear-gradient(160deg,#d2623f,#7a2414);display:flex;align-items:center;justify-content:center}
.ph svg{width:38%;opacity:.55}
.body{position:relative;z-index:1;padding:0 22px 6px}
.info{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.meta{flex:1;min-width:0}
.title{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:14px;font-weight:600;color:var(--fg2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;color:var(--fg2)}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;border:2px solid rgba(255,255,255,.35)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:2px}
.ctrl{display:flex;align-items:center;justify-content:space-around;margin:14px 0 10px}
.ctrl button{background:none;border:0;color:var(--fg);cursor:pointer;padding:8px}
.ctrl .sk svg{width:42px;height:42px}
.ctrl .pp svg{width:64px;height:64px}
.vol{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.vol svg{width:18px;height:18px;flex:none;color:var(--fg)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 26px calc(var(--sab) + 14px)}
.bar button{background:none;border:0;color:var(--fg);cursor:pointer;position:relative;padding:8px}
.bar svg{width:22px;height:22px}
.badge{position:absolute;top:-2px;right:-6px;font-size:9px;background:#fff;color:#5a1a10;border-radius:8px;padding:1px 4px;font-weight:700}
.bar button.on svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.75))}
.ctrl button:disabled{opacity:.4;cursor:default}

/* ---------- Hojas de cristal (lista y oyentes) ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 64px);z-index:8;display:flex;flex-direction:column;padding:14px 14px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 40%,rgba(255,255,255,.07)) 0%,color-mix(in srgb,var(--bg2) 48%,rgba(30,30,34,.5)) 55%,color-mix(in srgb,var(--bg3) 70%,rgba(20,20,24,.4)) 100%);border-radius:34px 34px 0 0;border:1px solid rgba(255,255,255,.1);border-bottom:0;-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 -20px 50px rgba(0,0,0,.4);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sh{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.sh h3{margin:0;font-size:19px;font-weight:700;flex:1}
.sh .cnt{font-size:14px;font-weight:600;color:var(--fg2)}
.list{overflow:auto;flex:1;padding-bottom:calc(var(--sab) + 24px)}
.empty{color:var(--fg2);text-align:center;margin-top:40px;font-size:14px;padding:0 20px;line-height:1.5}
.tr{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer}
.cv{width:46px;height:46px;border-radius:8px;background:#2a2a2d center/cover no-repeat;flex:none;display:grid;place-items:center}
.cv svg{width:20px;height:20px;opacity:.5}
.tm{flex:1;min-width:0;text-align:left}
.tm b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm span{display:block;font-size:13px;color:#b4b4ba;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.cur .tm b{color:#4fc3dc}
.tr .av{width:26px;height:26px;font-size:12px}
.pe{display:flex;align-items:center;gap:14px;padding:10px 6px}
.pe .av{width:40px;height:40px;font-size:16px}
.pe .tm b{font-size:16px}
.tag{font-size:11px;font-weight:700;border-radius:10px;padding:3px 8px;background:rgba(255,255,255,.14)}
.addbtn{margin:8px 4px 14px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:14px;background:#fff;color:#4a140c;font-weight:700;font-size:15px;border:0;cursor:pointer;width:calc(100% - 8px)}
.addbtn svg{width:20px;height:20px}
.note{margin:4px 6px 12px;font-size:12px;line-height:1.45;color:var(--fg2);background:rgba(0,0,0,.22);border-radius:14px;padding:10px 12px}
.scrim{position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}

/* Invitado: solo escucha; el anfitrión controla */
.guest #addBtn,.guest #repBtn,.guest #fav,.guest #addBtn2{visibility:hidden}
.guest #addBtn2{display:none}
.guest .ctrl .sk,.guest .ctrl .pp{opacity:.45}
.guest #seek{pointer-events:none}
.btn:disabled{opacity:.6;cursor:default}
.guest .tr{cursor:default}

.dbgl{position:relative;z-index:1;margin:18px auto 0;background:none;border:0;color:var(--fg2);font-size:13px;text-decoration:underline;cursor:pointer}
#dbg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:flex;flex-direction:column;padding:calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px);max-width:480px;margin:0 auto}
#dbg h3{margin:0 0 8px;font-size:18px}
#dbg pre{flex:1;overflow:auto;margin:0 0 10px;padding:12px;border-radius:14px;background:#151517;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:#d8d8dc}
#dbg .row{margin:0}
</style>
</head>

<div id="dbg" hidden><h3>Diagnóstico de conexión</h3><pre id="dbgT"></pre><div class="row"><button class="btn pri" id="dbgCopy">Copiar</button><button class="btn" id="dbgX">Cerrar</button></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   M5 Juntos — el anfitrión sube sus archivos y la otra persona los oye en directo.

   Cómo viaja el audio:
   - El audio que suena en el navegador del anfitrión se captura (Web Audio) y se envía por WebRTC
     directamente al navegador del invitado (de persona a persona; el audio no pasa por ningún servidor).
   - Un canal de datos WebRTC lleva el estado: título, artista, portada, cola, pausa y progreso.
   - Para que los dos navegadores se encuentren se usa un servicio de señalización (solo intercambia
     los datos de conexión, ~2 KB). Por defecto el servicio público gratuito de PeerJS.
   ===================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const COLORS=['#d2623f','#4fc3dc','#b08a4f','#8e6bd8','#4caf7a','#e0527a','#e0a23a'];
const colorOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const avatar=n=>`<span class="av" style="background:${colorOf(n)}">${esc((n[0]||'?').toUpperCase())}</span>`;
let toastT;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)};
const rand=()=>Math.random().toString(36).slice(2,9);
const D=[],T0=Date.now();
const dlog=m=>{D.push(((Date.now()-T0)/1000).toFixed(1).padStart(6)+'s  '+m);if(D.length>300)D.shift()};
function showDbg(){
  const head=['M5 Juntos · diagnóstico','Rol: '+(me.host?'anfitrión':(me.name?'invitado/ninguno':'ninguno'))+' · sala '+(S.code||hostCode||'-'),'Navegador: '+navigator.userAgent,'Página: '+location.href,'WebRTC: '+(window.RTCPeerConnection?'sí':'NO')+' · WebSocket: '+(window.WebSocket?'sí':'NO'),'Servicio de salas: '+SIG_URL.split('?')[0],'En línea: '+navigator.onLine,'---'];
  $('dbgT').textContent=head.concat(D).join('\n');$('dbg').hidden=false;
}
$('dbgOpen1').onclick=$('dbgOpen2').onclick=showDbg;
$('dbgX').onclick=()=>$('dbg').hidden=true;
$('dbgCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('dbgT').textContent);toast('Copiado')}catch(e){const r=document.createRange();r.selectNodeContents($('dbgT'));const g=getSelection();g.removeAllRanges();g.addRange(r);toast('Selecciona y copia el texto')}};
window.addEventListener('error',e=>dlog('ERROR página: '+e.message));
window.addEventListener('unhandledrejection',e=>dlog('ERROR promesa: '+(e.reason&&e.reason.message||e.reason)));

const SIG_URL=window.M5_SIG||'wss://0.peerjs.com/peerjs?key=peerjs';
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]};
const PFX='m5j-';

const me={name:'',host:false};
/* queue: {id,title,artist,dur,cover(grande),th(miniatura),file?(solo anfitrión)} */
const S={code:'',queue:[],cur:-1,playing:false,rep:false,people:[],hostName:''};
const G={pos:0,t0:0,dur:0}; /* progreso que recibe el invitado */

/* ---------- Señalización (protocolo del servidor PeerJS) ---------- */
function sigOpen(id,onmsg,onclose){
  return new Promise((res,rej)=>{
    let hb,done=false;
    dlog('señal: conectando como '+id);
    let ws;try{ws=new WebSocket(SIG_URL+'&id='+encodeURIComponent(id)+'&token='+rand())}catch(e){dlog('señal: no se pudo crear el WebSocket: '+e.message);return rej(new Error('ws'))}
    const api={ws,closed:false,send:(type,dst,payload)=>{if(type!=='CANDIDATE')dlog('señal → '+type+' para '+dst+(ws.readyState===1?'':' (¡socket no abierto: estado '+ws.readyState+'!)'));if(ws.readyState===1)ws.send(JSON.stringify({type,dst,payload}))},close:()=>{api.closed=true;clearInterval(hb);try{ws.close()}catch(e){}}};
    const to=setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'));api.close()}},9000);
    ws.onmessage=e=>{
      let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.type!=='OPEN'&&m.type!=='CANDIDATE'&&m.type!=='HEARTBEAT')dlog('señal ← '+m.type+(m.src?' de '+m.src:'')+(m.payload&&m.payload.msg?' · '+m.payload.msg:''));
      if(m.type==='OPEN'){dlog('señal: conectado al servicio (OPEN)');done=true;clearTimeout(to);hb=setInterval(()=>{if(ws.readyState===1)ws.send('{"type":"HEARTBEAT"}')},5000);res(api)}
      else if(m.type==='ID-TAKEN'||m.type==='INVALID-KEY'||m.type==='ERROR'){if(!done){done=true;clearTimeout(to);rej(new Error(m.type))}}
      else onmsg&&onmsg(m);
    };
    ws.onerror=()=>{dlog('señal: error de WebSocket');if(!done){done=true;clearTimeout(to);rej(new Error('ws'))}};
    ws.onclose=ev=>{dlog('señal: WebSocket cerrado'+(ev&&ev.code?' (código '+ev.code+')':''));clearInterval(hb);if(!done){done=true;clearTimeout(to);rej(new Error('ws'));return}if(onclose&&!api.closed)onclose(api)};
  });
}
/* Opus en estéreo y a alta calidad (por defecto WebRTC usa voz en mono a ~32 kbps) */
const munge=sdp=>sdp.replace(/a=fmtp:(\d+) ([^\r\n]*)/g,(m,pt,rest)=>{
  if(!new RegExp('a=rtpmap:'+pt+' opus/','i').test(sdp)||/stereo=/.test(rest))return m;
  return 'a=fmtp:'+pt+' '+rest+';stereo=1;sprop-stereo=1;maxaveragebitrate=256000;usedtx=0';
});
const dcSend=(dc,m)=>{if(dc&&dc.readyState==='open'){try{dc.send(JSON.stringify(m))}catch(e){}}};

/* ---------- Audio del anfitrión: <audio> → Web Audio → (altavoces) + (flujo WebRTC) ---------- */
const audio=new Audio();audio.preload='auto';
let actx=null,gain=null,dest=null;
function initAudio(){
  if(actx)return;
  actx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const src=actx.createMediaElementSource(audio);
  gain=actx.createGain();gain.gain.value=$('vol').value/100;
  dest=actx.createMediaStreamDestination();
  src.connect(gain);gain.connect(actx.destination); /* lo que oye el anfitrión (con su volumen) */
  src.connect(dest);                                 /* lo que se envía (volumen completo) */
}

/* ====================== ANFITRIÓN ====================== */
const guests=new Map(); /* id → {pc,dc,name,cand:[],open} */
let sig=null,tickT=null;
const newCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s};

async function startHost(){
  initAudio();actx.resume();
  let code='';
  for(let i=0;i<6&&!sig;i++){
    code=newCode();
    try{sig=await sigOpen(PFX+code,hostSig,hostSigClosed)}
    catch(e){if(e.message!=='ID-TAKEN')throw e}
  }
  if(!sig)throw new Error('ID-TAKEN');
  hostCode=code;
  return code;
}
/* Si el WebSocket con el servicio de salas se cae (pantalla apagada, cambio de red…), se vuelve a registrar el mismo código */
let hostCode='',hostRetry=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const setLink=ok=>{const d=$('dot');if(d){d.style.background=ok?'#7ee08a':'#ff6b6b';d.style.boxShadow=ok?'0 0 8px #7ee08a':'0 0 8px #ff6b6b'}};
function hostSigClosed(){if(me.host&&hostCode){setLink(false);retryHostSig()}}
async function retryHostSig(){
  if(hostRetry)return;hostRetry=true;
  for(let i=0;i<60&&me.host&&hostCode;i++){
    try{sig=await sigOpen(PFX+hostCode,hostSig,hostSigClosed);hostRetry=false;setLink(true);return}
    catch(e){await sleep(2000)}
  }
  hostRetry=false;if(me.host&&hostCode)toast('No se pudo reconectar con el servicio de salas');
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&me.host&&hostCode&&(!sig||!sig.ws||sig.ws.readyState!==1)){setLink(false);retryHostSig()}
});
function hostSig(m){
  if(m.type==='OFFER')hostOffer(m.src,m.payload).catch(e=>{console.error('oferta',e);dlog('anfitrión: ERROR al aceptar: '+(e&&e.message||e));toast('Error al conectar con un invitado: '+(e&&e.message||e));dropGuest(m.src,true)});
  else if(m.type==='CANDIDATE'){const g=guests.get(m.src);if(g)addCand(g,m.payload&&m.payload.candidate)}
  else if(m.type==='LEAVE')dropGuest(m.src);
}
function addCand(g,c){
  if(!c)return;
  if(g.pc.remoteDescription)g.pc.addIceCandidate(c).catch(()=>{});else g.cand.push(c);
}
async function hostOffer(src,p){
  dlog('anfitrión: recibí solicitud de '+src);
  const prev=guests.get(src);
  if(prev&&prev.sdp===p.sdp){if(prev.ans)sig.send('ANSWER',src,{sdp:prev.ans});return} /* oferta repetida: se reenvía la misma respuesta */
  dropGuest(src,true);
  const pc=new RTCPeerConnection(ICE),g={pc,dc:null,name:'Invitado',cand:[],open:false,sdp:p.sdp,ans:''};
  guests.set(src,g);
  pc.onicecandidate=e=>{if(e.candidate)sig.send('CANDIDATE',src,{candidate:e.candidate.toJSON()})};
  pc.oniceconnectionstatechange=()=>dlog('anfitrión: ICE '+pc.iceConnectionState);
  pc.onconnectionstatechange=()=>{dlog('anfitrión: conexión '+pc.connectionState);if(pc.connectionState==='failed'||pc.connectionState==='closed')dropGuest(src)};
  pc.ondatachannel=e=>{
    g.dc=e.channel;
    e.channel.onopen=()=>{g.open=true;dlog('anfitrión: canal de datos abierto')};
    e.channel.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(x){return}onGuestMsg(src,g,m)};
    e.channel.onclose=()=>dropGuest(src);
  };
  await pc.setRemoteDescription({type:'offer',sdp:p.sdp});
  const tr=pc.getTransceivers().find(t=>t.receiver.track&&t.receiver.track.kind==='audio');
  await tr.sender.replaceTrack(dest.stream.getAudioTracks()[0]);
  tr.direction='sendonly';
  const ans=await pc.createAnswer();ans.sdp=munge(ans.sdp);
  await pc.setLocalDescription(ans);
  g.ans=ans.sdp;sig.send('ANSWER',src,{sdp:ans.sdp});dlog('anfitrión: respuesta enviada');
  g.cand.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
  /* subir el bitrate del emisor (por defecto es bajo) */
  [800,3000].forEach(ms=>setTimeout(async()=>{try{
    const sd=tr.sender,pr=sd.getParameters();if(!pr.encodings||!pr.encodings.length)pr.encodings=[{}];
    pr.encodings[0].maxBitrate=256000;await sd.setParameters(pr);
  }catch(e){}},ms));
}
function onGuestMsg(id,g,m){
  dlog('anfitrión: mensaje del invitado: '+m.t);
  if(m.t==='hello'){
    g.name=String(m.name||'Invitado').slice(0,20);g.hello=true;
    sendFull(g);broadcastPeople();toast(g.name+' se unió');
  }
}
function dropGuest(id,silent){
  const g=guests.get(id);if(!g)return;
  guests.delete(id);
  try{g.dc&&g.dc.close()}catch(e){}try{g.pc.close()}catch(e){}
  if(!silent){if(g.hello)toast(g.name+' salió');broadcastPeople();renderPeople();renderNow()}
}
const bcast=m=>guests.forEach(g=>dcSend(g.dc,m));
const peopleList=()=>[{name:me.name,host:true},...[...guests.values()].filter(g=>g.hello).map(g=>({name:g.name}))];
function broadcastPeople(){S.people=peopleList();bcast({t:'people',list:S.people});renderPeople();renderNow()}
const stateMsg=()=>({t:'state',host:me.name,q:S.queue.map(t=>({id:t.id,title:t.title,artist:t.artist,dur:t.dur})),cur:S.cur,playing:S.playing,pos:audio.currentTime||0,dur:audio.duration||0,rep:S.rep});
function sendFull(g){
  dcSend(g.dc,{t:'people',list:peopleList()});
  dcSend(g.dc,stateMsg());
  S.queue.forEach(t=>{if(t.th)dcSend(g.dc,{t:'th',id:t.id,img:t.th})});
  const c=S.queue[S.cur];if(c&&c.big)dcSend(g.dc,{t:'cover',id:c.id,img:c.big});
}
const bState=()=>bcast(stateMsg());
setInterval(()=>{if(me.host&&guests.size&&S.cur>=0)bcast({t:'time',pos:audio.currentTime||0,playing:!audio.paused,dur:audio.duration||0})},1000);

/* ====================== INVITADO ====================== */
let gpc=null,gdc=null;
const remote=new Audio();remote.autoplay=true;remote.playsInline=true;
const stage=t=>{const b=$('jn');if(b&&b.disabled)b.textContent=t};
function failJoin(msg){toast(msg);leaveRoom(true)}
async function startGuest(code){
  const gid='g'+rand()+rand();
  let gotAns=false,settled=false;
  const cands=[];
  sig=await sigOpen(gid,m=>{
    if(m.type==='ANSWER'){dlog('invitado: recibí la respuesta del anfitrión');gotAns=true;gpc.setRemoteDescription({type:'answer',sdp:m.payload.sdp}).then(()=>cands.splice(0).forEach(c=>gpc.addIceCandidate(c).catch(()=>{}))).catch(()=>{})}
    else if(m.type==='CANDIDATE'){const c=m.payload&&m.payload.candidate;if(!c)return;if(gpc&&gpc.remoteDescription)gpc.addIceCandidate(c).catch(()=>{});else cands.push(c)}
    else if(m.type==='EXPIRE'&&!settled)failJoin('No existe una sala con el código '+code);
  });
  stage('Buscando la sala…');
  gpc=new RTCPeerConnection(ICE);
  gpc.addTransceiver('audio',{direction:'recvonly'});
  gdc=gpc.createDataChannel('ctl');
  gpc.oniceconnectionstatechange=()=>dlog('invitado: ICE '+gpc.iceConnectionState);
  gpc.onicecandidate=e=>{if(e.candidate)sig&&sig.send('CANDIDATE',PFX+code,{candidate:e.candidate.toJSON()})};
  gpc.ontrack=e=>{
    dlog('invitado: llegó el audio');
    remote.srcObject=e.streams[0]||new MediaStream([e.track]);
    remote.volume=$('vol').value/100;
    remote.play().catch(()=>{toast('Toca la pantalla para activar el sonido');document.addEventListener('pointerdown',()=>remote.play().catch(()=>{}),{once:true})});
  };
  gpc.onconnectionstatechange=()=>{dlog('invitado: conexión '+gpc.connectionState);if(settled&&(gpc.connectionState==='failed'))hostGone('Se perdió la conexión')};
  gdc.onopen=()=>{dlog('invitado: canal de datos abierto');settled=true;dcSend(gdc,{t:'hello',name:me.name});if(sig){sig.close();sig=null}};
  gdc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}onHostMsg(m)};
  gdc.onclose=()=>{if(settled)hostGone('El anfitrión cerró la sala')};
  const off=await gpc.createOffer();off.sdp=munge(off.sdp);
  await gpc.setLocalDescription(off);
  sig.send('OFFER',PFX+code,{sdp:off.sdp});stage('Esperando al anfitrión…');
  /* esperar a que el canal abra; si el anfitrión aún no contesta, se reenvía la solicitud cada 3 s */
  await new Promise((res,rej)=>{
    const t0=Date.now();let last=t0;
    const iv=setInterval(()=>{
      if(gdc.readyState==='open'){clearInterval(iv);res()}
      else if(Date.now()-t0>18000){clearInterval(iv);rej(new Error(gotAns?'ice':'noanswer'))}
      else if(!gotAns&&Date.now()-last>3000&&sig){last=Date.now();sig.send('OFFER',PFX+code,{sdp:off.sdp})}
      else if(gotAns)stage('Conectando…');
    },150);
  });
}
function hostGone(msg){if(!me.host&&!$('room').hidden){toast(msg);leaveRoom(true)}}
const thumbs=new Map(),bigs=new Map();
function onHostMsg(m){
  if(m.t==='people'){S.people=m.list;renderPeople();renderNow()}
  else if(m.t==='state'){
    S.hostName=m.host;S.queue=m.q.map(t=>({...t,th:thumbs.get(t.id)||'',cover:bigs.get(t.id)||''}));
    S.cur=m.cur;S.playing=m.playing;S.rep=m.rep;G.pos=m.pos;G.t0=performance.now();G.dur=m.dur||0;
    renderAll();
  }
  else if(m.t==='th'){thumbs.set(m.id,m.img);const t=S.queue.find(x=>x.id===m.id);if(t){t.th=m.img;renderQueue()}}
  else if(m.t==='cover'){bigs.set(m.id,m.img);const t=S.queue.find(x=>x.id===m.id);if(t){t.cover=m.img;if(S.queue[S.cur]===t)renderNow()}}
  else if(m.t==='time'){G.pos=m.pos;G.t0=performance.now();G.dur=m.dur||G.dur;if(m.playing!==S.playing){S.playing=m.playing;renderPP()}}
}
const guestPos=()=>Math.min(G.dur||1e9,G.pos+(S.playing?(performance.now()-G.t0)/1000:0));
setInterval(()=>{if(!me.host&&!$('room').hidden&&S.cur>=0)paintTime(guestPos(),G.dur)},250);

/* ====================== Inicio / salir ====================== */
function setRole(host){
  me.host=host;$('room').classList.toggle('guest',!host);
  $('seek').disabled=!host;
}
async function enter(host,code){
  me.name=($('nameIn').value.trim()||(host?'Anfitrión':'Invitado')).slice(0,20);
  const b=host?$('mk'):$('jn'),old=b.textContent;b.disabled=true;b.textContent=host?'Creando…':'Conectando…';
  try{
    setRole(host);
    if(host)code=await startHost();else await startGuest(code);
  }catch(e){
    b.disabled=false;b.textContent=old;
    const msg={timeout:'No se pudo contactar con el servicio de salas (¿sin internet o bloqueado?)',ws:'No se pudo contactar con el servicio de salas (¿sin internet o bloqueado?)',noanswer:'El anfitrión no respondió. Revisa el código y que su pantalla siga abierta en la sala',ice:'No se pudo establecer la conexión directa (la red puede estar bloqueando WebRTC)'}[e.message]||'No se pudo '+(host?'crear':'entrar a')+' la sala';
    dlog('FALLO al '+(host?'crear':'unirse')+': '+e.message);toast(msg+' · Mira «Ver diagnóstico»');cleanup();return;
  }
  b.disabled=false;b.textContent=old;
  S.code=code;
  if(host){S.queue=[];S.cur=-1;S.playing=false;S.rep=false;S.hostName=me.name;S.people=[{name:me.name,host:true}]}
  /* el invitado conserva lo que el anfitrión ya le envió al abrirse el canal */
  $('home').hidden=true;$('room').hidden=false;$('rcode').textContent=code;setLink(true);
  renderAll();toast(host?'Sala '+code+' creada: pásale el código a tu amigo':'Conectado a la sala '+code);
}
$('mk').onclick=()=>enter(true);
$('jn').onclick=()=>{const c=$('codeIn').value.trim().toUpperCase();if(c.length<4)return toast('Escribe el código de 4 letras');enter(false,c)};
$('codeIn').onkeydown=e=>{if(e.key==='Enter')$('jn').click()};
function cleanup(){
  hostCode='';
  if(sig){sig.close();sig=null}
  guests.forEach((g,id)=>{try{g.dc&&g.dc.close()}catch(e){}try{g.pc.close()}catch(e){}});guests.clear();
  if(gdc){try{gdc.close()}catch(e){}gdc=null}if(gpc){try{gpc.close()}catch(e){}gpc=null}
  remote.pause();remote.srcObject=null;
  audio.pause();thumbs.clear();bigs.clear();
}
function leaveRoom(quiet){
  if(me.host)bcast({t:'bye'});
  cleanup();
  S.queue=[];S.cur=-1;S.playing=false;S.people=[];
  $('room').hidden=true;$('home').hidden=false;closeSheets();setPalette('');
}
$('leave').onclick=()=>leaveRoom();
$('share').onclick=async()=>{try{await navigator.clipboard.writeText(S.code);toast('Código copiado: '+S.code)}catch(e){toast('Código: '+S.code)}};

/* ---------- Archivos locales (solo anfitrión) ---------- */
function readTags(file){
  /* ID3v2 mínimo (TIT2, TPE1, APIC) para mostrar título, artista y portada como en M5 Music */
  return file.slice(0,1<<20).arrayBuffer().then(buf=>{
    const d=new DataView(buf),u=new Uint8Array(buf),out={};
    if(u[0]!==0x49||u[1]!==0x44||u[2]!==0x33)return out;
    const ver=u[3];let size=((u[6]&127)<<21)|((u[7]&127)<<14)|((u[8]&127)<<7)|(u[9]&127);
    let p=10;const end=Math.min(10+size,buf.byteLength);
    const dec=(a,enc)=>{const dd=new TextDecoder(enc===1?'utf-16':enc===2?'utf-16be':enc===3?'utf-8':'iso-8859-1');return dd.decode(a).replace(/\0+$/,'')};
    while(p+10<end){
      const id=String.fromCharCode(u[p],u[p+1],u[p+2],u[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
      const sz=ver===4?((u[p+4]&127)<<21)|((u[p+5]&127)<<14)|((u[p+6]&127)<<7)|(u[p+7]&127):d.getUint32(p+4);
      const f=u.subarray(p+10,p+10+sz);p+=10+sz;if(!sz)break;
      if(id==='TIT2')out.title=dec(f.subarray(1),f[0]);
      else if(id==='TPE1')out.artist=dec(f.subarray(1),f[0]);
      else if(id==='APIC'){
        const enc=f[0];let i=1;while(f[i])i++;const mime=dec(f.subarray(1,i),0);i+=2;
        if(enc===1||enc===2){while(!(f[i]===0&&f[i+1]===0))i+=2;i+=2}else{while(f[i])i++;i++}
        out.cover=URL.createObjectURL(new Blob([f.subarray(i)],{type:mime.includes('/')?mime:'image/jpeg'}));
      }
    }
    return out;
  }).catch(()=>({}));
}
function durOf(file){
  return new Promise(res=>{const a=new Audio(),u=URL.createObjectURL(file);a.preload='metadata';a.src=u;a.onloadedmetadata=()=>{res(a.duration||0);URL.revokeObjectURL(u)};a.onerror=()=>{res(0);URL.revokeObjectURL(u)}});
}
/* Reduce la portada para enviarla por el canal de datos (grande ~480px y miniatura ~72px) */
function shrink(src,px,q){
  return new Promise(res=>{const im=new Image();im.onload=()=>{try{
    const k=Math.min(1,px/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));
  }catch(e){res('')}};im.onerror=()=>res('');im.src=src});
}
async function addFiles(files){
  if(!me.host)return;
  const arr=[...files].filter(f=>/^audio\//.test(f.type)||/\.(mp3|flac|wav|m4a|ogg)$/i.test(f.name));
  if(!arr.length)return toast('Elige archivos de audio');
  for(const f of arr){
    const tg=await readTags(f),dur=await durOf(f);
    const base=f.name.replace(/\.[^.]+$/,'');
    const t={id:rand(),title:tg.title||base,artist:tg.artist||'Artista desconocido',cover:tg.cover||'',dur,file:f,th:'',big:''};
    if(tg.cover){t.th=await shrink(tg.cover,72,.6);t.big=await shrink(tg.cover,480,.72)}
    S.queue.push(t);
    if(t.th)bcast({t:'th',id:t.id,img:t.th});
  }
  renderQueue();bState();
  if(S.cur<0)play(0,false);
  toast(arr.length===1?'1 canción añadida':arr.length+' canciones añadidas');
}
['addBtn','addBtn2'].forEach(i=>$(i).onclick=()=>{if(me.host)$('file').click()});
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};

/* ---------- Reproducción (anfitrión) ---------- */
let curUrl='';
function play(i,go=true){
  const t=S.queue[i];if(!t)return;
  S.cur=i;
  if(curUrl)URL.revokeObjectURL(curUrl);
  curUrl=URL.createObjectURL(t.file);audio.src=curUrl;
  if(actx)actx.resume();
  if(go)audio.play().catch(()=>{});
  renderNow();renderQueue();
  bState();if(t.big)bcast({t:'cover',id:t.id,img:t.big});
}
audio.onplay=()=>{if(!me.host)return;S.playing=true;renderPP();bState()};
audio.onpause=()=>{if(!me.host)return;S.playing=false;renderPP();bState()};
audio.onseeked=()=>{if(me.host)bState()};
audio.onended=()=>{if(S.rep)play(S.cur);else if(S.cur<S.queue.length-1)play(S.cur+1);else{S.playing=false;renderPP();bState()}};
audio.ontimeupdate=()=>{if(me.host)paintTime(audio.currentTime,audio.duration||0)};
function paintTime(pos,d){
  $('cur').textContent=fmt(pos);
  if(d){$('dur').textContent=fmt(d);const v=Math.round(Math.min(1,pos/d)*1000);if(!seeking){$('seek').value=v;$('seek').style.setProperty('--p',v/10+'%')}}
}
const guestLock=()=>{toast('Solo el anfitrión controla la música');};
$('pp').onclick=()=>{if(!me.host)return guestLock();if(S.cur<0)return $('file').click();actx&&actx.resume();audio.paused?audio.play().catch(()=>{}):audio.pause()};
$('next').onclick=()=>{if(!me.host)return guestLock();if(S.cur<S.queue.length-1)play(S.cur+1,S.playing)};
$('prev').onclick=()=>{if(!me.host)return guestLock();if(audio.currentTime>3)audio.currentTime=0;else if(S.cur>0)play(S.cur-1,S.playing)};
let seeking=false;
$('seek').onpointerdown=()=>{seeking=true};$('seek').onpointerup=()=>{seeking=false};
$('seek').oninput=e=>{if(!me.host)return;const d=audio.duration;if(d)audio.currentTime=e.target.value/1000*d;e.target.style.setProperty('--p',e.target.value/10+'%')};
$('seek').onchange=()=>{seeking=false};
$('vol').oninput=e=>{const v=e.target.value/100;if(me.host){if(gain)gain.gain.value=v}else remote.volume=v;e.target.style.setProperty('--p',e.target.value+'%')};
$('vol').style.setProperty('--p','80%');
$('repBtn').onclick=()=>{if(!me.host)return;S.rep=!S.rep;$('repBtn').classList.toggle('on',S.rep);toast(S.rep?'Repetir canción: sí':'Repetir canción: no');bState()};
$('fav').onclick=()=>$('fav').classList.toggle('on');

/* ---------- Pintado ---------- */
const NOTE='<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>';
function renderPP(){$('ppIcon').innerHTML=S.playing?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>'}
function setPalette(src){
  /* Color promedio de la portada → degradado de fondo (como applyPalette en M5 Music) */
  const root=document.documentElement.style;
  if(!src){['--bg1','--bg2','--bg3'].forEach(k=>root.removeProperty(k));return}
  const im=new Image();im.onload=()=>{try{
    const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(im,0,0,16,16);
    const px=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;
    for(let i=0;i<px.length;i+=4){r+=px[i];g+=px[i+1];b+=px[i+2];n++}
    r/=n;g/=n;b/=n;const k=(m,a)=>`rgb(${Math.round(r*m+a)},${Math.round(g*m+a)},${Math.round(b*m+a)})`;
    root.setProperty('--bg1',k(.8,10));root.setProperty('--bg2',k(.35,0));root.setProperty('--bg3',k(.12,0));
  }catch(e){}};im.src=src;
}
function renderNow(){
  const t=S.queue[S.cur];
  $('title').textContent=t?t.title:'Nada sonando';
  $('artist').textContent=t?t.artist:(me.host?'Añade canciones desde tu dispositivo':'Esperando a que el anfitrión ponga música');
  const cv=t&&t.cover;
  $('cover').innerHTML=cv?`<img src="${cv}" alt="">`:`<div class="ph">${NOTE}</div>`;
  $('bgblur').style.backgroundImage=cv?`url(${cv})`:'';
  setPalette(cv||'');
  const w=$('who'),others=Math.max(0,S.people.length-1);
  w.hidden=false;
  w.innerHTML=me.host
    ?(others?`${avatar(S.people[1].name)}<span>Transmitiendo en directo a <b>${others}</b> ${others===1?'persona':'personas'}</span>`:`<span>Aún no hay nadie más. Pásale el código <b>${esc(S.code)}</b> a tu amigo.</span>`)
    :`${avatar(S.hostName||'?')}<span>Escuchando en directo con <b>${esc(S.hostName||'el anfitrión')}</b></span>`;
  $('seek').disabled=!me.host||!t;
  if(!t){$('cur').textContent='0:00';$('dur').textContent='0:00';$('seek').value=0;$('seek').style.setProperty('--p','0%')}
  else{$('dur').textContent=fmt(me.host?t.dur:(G.dur||t.dur))}
}
function renderQueue(){
  const n=S.queue.length;$('qCount').textContent=n?n+(n===1?' canción':' canciones'):'';
  const b=$('qBadge');b.hidden=!n;b.textContent=n;
  $('list').innerHTML=n?S.queue.map((t,i)=>{const im=t.th||t.cover;return`<div class="tr${i===S.cur?' cur':''}" data-i="${i}"><div class="cv" style="${im?`background-image:url(${im})`:''}">${im?'':NOTE}</div><div class="tm"><b>${esc(t.title)}</b><span>${esc(t.artist)} · ${fmt(t.dur)}</span></div></div>`}).join(''):`<div class="empty">${me.host?'La cola está vacía.<br>Añade canciones de tu dispositivo y tu amigo las oirá al mismo tiempo.':'Todavía no hay canciones.<br>Cuando el anfitrión añada música, aparecerá aquí.'}</div>`;
}
function renderPeople(){
  const a=S.people;$('pCount').textContent=a.length+(a.length===1?' persona':' personas');
  $('plist').innerHTML=(me.host?`<div class="note">Comparte el código <b>${esc(S.code)}</b> para que la otra persona entre a esta sala.</div>`:'')+a.map((p,i)=>`<div class="pe">${avatar(p.name)}<div class="tm"><b>${esc(p.name)}</b></div>${p.host?'<span class="tag">Anfitrión</span>':''}${(me.host?i===0:p.name===me.name&&!p.host)?'<span class="tag">Tú</span>':''}</div>`).join('');
}
function renderAll(){renderPP();renderNow();renderQueue();renderPeople();$('repBtn').classList.toggle('on',S.rep)}
$('list').onclick=e=>{if(!me.host)return;const r=e.target.closest('.tr');if(r)play(+r.dataset.i,true)};

/* ---------- Hojas ---------- */
const closeSheets=()=>{['qSheet','pSheet'].forEach(i=>$(i).classList.remove('open'));$('scrim').classList.remove('on')};
const openSheet=id=>{closeSheets();$(id).classList.add('open');$('scrim').classList.add('on')};
$('listBtn').onclick=()=>openSheet('qSheet');
$('ppl').onclick=()=>openSheet('pSheet');
$('scrim').onclick=closeSheets;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
renderPP();
window.addEventListener('pagehide',()=>{if(me.host)bcast({t:'bye'})});
</script>
</body>
